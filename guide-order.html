<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ клиента — ДагТур</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  body{background:#f5f5f2;margin:0}
  .header.visible{background:#e6effe}
  .header.visible .nav a{color:#1a1a1a}

  .go-page{max-width:900px;margin:0 auto;padding:120px 24px 80px;
    font-family:'Montserrat',sans-serif;box-sizing:border-box}
  .go-back{display:inline-block;font-size:13px;color:#4e75a6;text-decoration:none;
    font-weight:600;margin-bottom:20px}
  .go-back:hover{text-decoration:underline}

  .go-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
    flex-wrap:wrap;margin-bottom:24px}
  .go-tour{font-size:30px;font-weight:700;color:#1a1a1a;letter-spacing:-.5px;margin:0 0 4px}
  .go-meta{font-size:13px;color:#727056}
  .go-status{font-size:12px;font-weight:700;padding:6px 16px;border-radius:100px;white-space:nowrap}
  .go-status--paid{background:#fff3e0;color:#e65100}
  .go-status--cancelled{background:#eee;color:#888}

  .go-client-card{background:#e6effe;border-radius:18px;padding:20px 24px;margin-bottom:24px;
    display:flex;gap:30px;flex-wrap:wrap}
  .go-field{display:flex;flex-direction:column;gap:3px}
  .go-field-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#727056;font-weight:600}
  .go-field-val{font-size:15px;font-weight:600;color:#1a1a1a}
  .go-field-val a{color:#4e75a6;text-decoration:none}

  .go-chat{background:#fff;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);
    overflow:hidden;display:flex;flex-direction:column;height:540px}
  .go-chat-head{padding:18px 24px;border-bottom:1px solid rgba(0,0,0,.07);
    font-size:15px;font-weight:700;color:#1a1a1a}
  .go-chat-head span{font-size:12px;font-weight:500;color:#727056;display:block;margin-top:2px}
  .go-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
  .go-msg{display:flex;flex-direction:column;max-width:75%}
  .go-msg--mine{align-self:flex-end;align-items:flex-end}
  .go-msg--their{align-self:flex-start;align-items:flex-start}
  .go-bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
  .go-msg--mine .go-bubble{background:#4e75a6;color:#fff;border-radius:14px 14px 4px 14px}
  .go-msg--their .go-bubble{background:#f0f0ee;color:#1a1a1a;border-radius:14px 14px 14px 4px}
  .go-time{font-size:10px;color:#aaa;margin-top:3px}
  .go-empty-chat{text-align:center;color:#aaa;font-size:13px;margin:auto}

  .go-input-row{display:flex;gap:10px;padding:16px 24px;border-top:1px solid rgba(0,0,0,.07)}
  .go-input{flex:1;border:1.5px solid rgba(0,0,0,.15);border-radius:100px;padding:11px 18px;
    font-family:inherit;font-size:14px;outline:none;transition:border-color .2s}
  .go-input:focus{border-color:#4e75a6}
  .go-send{background:#1a1a1a;color:#fff;border:none;padding:11px 26px;border-radius:100px;
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .go-send:hover{background:#333}

  .go-guard{max-width:480px;margin:0 auto;padding:180px 24px;text-align:center;
    font-family:'Montserrat',sans-serif;display:none}
  .go-guard .ico{font-size:46px;margin-bottom:14px}
  .go-guard h2{font-size:22px;font-weight:700;margin-bottom:10px;color:#1a1a1a}
  .go-guard a{background:#1a1a1a;color:#fff;padding:13px 36px;border-radius:100px;
    font-size:14px;font-weight:600;text-decoration:none;display:inline-block;margin-top:10px}
</style>
</head>
<body>

<header class="header visible">
  <div class="header-left">
    <img class="logo" src="image/logo.png" alt="Лого">
    <nav class="nav">
      <a href="main.html">главная</a>
      <div class="nav-item--tours">
        <a href="#">туры</a>
        <div class="nav-dropdown">
          <a href="tours/tours.html#odnodnevnye">однодневные</a>
          <a href="tours/tours.html#mnogodnevnye">многодневные</a>
          <a href="tours/tours.html#gornye">горные</a>
        </div>
      </div>
      <a href="#">контакты</a>
      <a href="gidy.html">гидам</a>
    </nav>
  </div>
  <div class="header-btns">
    <a href="#" class="header-btn-reg" id="regOpenBtn">регистрация</a>
    <a href="#" class="header-btn-login" id="authOpenBtn">вход</a>
  </div>
</header>

<div class="go-guard" id="goGuard">
  <div class="ico">🔒</div>
  <h2>Нет доступа к этому заказу</h2>
  <a href="guide-bookings.html">← к заказам</a>
</div>

<div class="go-page" id="goPage" style="display:none">
  <a class="go-back" href="guide-bookings.html">← Все заказы клиентов</a>

  <div class="go-head">
    <div>
      <h1 class="go-tour" id="goTour">—</h1>
      <div class="go-meta" id="goMeta">—</div>
    </div>
    <span class="go-status" id="goStatus"></span>
  </div>

  <div class="go-client-card" id="goClientCard"></div>

  <div class="go-chat">
    <div class="go-chat-head">Чат с клиентом<span id="goChatSub">сообщения сохраняются, клиент видит их в своём заказе</span></div>
    <div class="go-messages" id="goMessages"></div>
    <div class="go-input-row">
      <input class="go-input" id="goInput" placeholder="Напишите клиенту…" maxlength="2000">
      <button class="go-send" id="goSend">Отправить</button>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
<script>
const bookingId = new URLSearchParams(location.search).get('id');
let myRole = 'guide';
let lastCount = 0;
let pollTimer = null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(s){
  const d=new Date(s+'T00:00:00');
  const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const w=['вс','пн','вт','ср','чт','пт','сб'];
  return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear()+', '+w[d.getDay()];
}
function fmtTime(s){
  const d=new Date((s||'').replace(' ','T')+'Z');
  if(isNaN(d))return '';
  return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
}
async function call(url,options={}){
  const res=await fetch(url,{credentials:'same-origin',...options});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Ошибка сервера');
  return data;
}

function renderMessages(messages){
  const box=document.getElementById('goMessages');
  if(!messages.length){
    box.innerHTML=`<div class="go-empty-chat">Сообщений пока нет.<br>Напишите клиенту первым 👋</div>`;
    return;
  }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML=messages.map(m=>{
    const mine = m.sender_role===myRole;
    return `
      <div class="go-msg go-msg--${mine?'mine':'their'}">
        <div class="go-bubble">${esc(m.text)}</div>
        <div class="go-time">${esc(m.sender_name||'')} · ${fmtTime(m.created_at)}</div>
      </div>`;
  }).join('');
  if(atBottom || messages.length!==lastCount) box.scrollTop=box.scrollHeight;
  lastCount=messages.length;
}

async function loadMessages(){
  try{
    const {messages,myRole:role}=await call(`/api/booking/${bookingId}/messages`);
    myRole=role;
    renderMessages(messages);
  }catch(e){ /* тихо, чтобы опрос не спамил */ }
}

async function sendMessage(){
  const input=document.getElementById('goInput');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  try{
    await call(`/api/booking/${bookingId}/messages`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    });
    loadMessages();
  }catch(e){ alert(e.message); input.value=text; }
}

async function init(){
  if(!bookingId){ document.getElementById('goGuard').style.display='block'; return; }
  try{
    const {user}=await call('/api/me');
    if(!user){ document.getElementById('goGuard').style.display='block'; return; }

    // данные заказа берём из эндпоинта одного заказа
    const {booking}=await call('/api/booking/'+bookingId);
    document.getElementById('goPage').style.display='block';
    document.getElementById('goTour').textContent=booking.tour_title||'Тур';
    document.getElementById('goMeta').textContent=
      `${fmtDate(booking.date)} · ${booking.people} чел. · заказ №${String(booking.id).padStart(6,'0')}`;
    const st=document.getElementById('goStatus');
    const cancelled=booking.status==='cancelled';
    st.textContent=cancelled?'Отменён':'Активен';
    st.className='go-status go-status--'+booking.status;

    document.getElementById('goClientCard').innerHTML=`
      <div class="go-field"><span class="go-field-label">Клиент</span>
        <span class="go-field-val">${esc(booking.customer_name||'—')}</span></div>
      ${booking.customer_phone?`<div class="go-field"><span class="go-field-label">Телефон</span>
        <span class="go-field-val"><a href="tel:${esc(booking.customer_phone)}">${esc(booking.customer_phone)}</a></span></div>`:''}
      ${booking.customer_email?`<div class="go-field"><span class="go-field-label">Email</span>
        <span class="go-field-val"><a href="mailto:${esc(booking.customer_email)}">${esc(booking.customer_email)}</a></span></div>`:''}
    `;

    loadMessages();
    pollTimer=setInterval(loadMessages, 4000); // живой опрос раз в 4 сек
  }catch(e){
    document.getElementById('goGuard').style.display='block';
  }
}

document.getElementById('goSend').addEventListener('click', sendMessage);
document.getElementById('goInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); sendMessage(); }
});
window.addEventListener('beforeunload', ()=>{ if(pollTimer) clearInterval(pollTimer); });

init();
</script>
</body>
</html>
