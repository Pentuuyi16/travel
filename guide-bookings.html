<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказы клиентов — ДагТур</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/footer.css">
<style>
  body{background:#f5f5f2;margin:0}
  .header.visible{background:#e6effe}
  .header.visible .nav a{color:#1a1a1a}

  .gb-page{max-width:880px;margin:0 auto;padding:130px 24px 90px;
    font-family:'Montserrat',sans-serif;box-sizing:border-box}
  .gb-title{font-size:34px;font-weight:700;letter-spacing:-.5px;color:#1a1a1a;margin:0 0 6px}
  .gb-sub{font-size:14px;color:#727056;margin:0 0 30px}

  .gb-list{display:flex;flex-direction:column;gap:16px}

  .gb-card{
    display:grid !important;
    grid-template-columns:1fr auto !important;
    grid-template-areas:"main side" !important;
    gap:16px 24px !important;
    align-items:center !important;
    background:#fff !important;
    border-radius:20px !important;
    padding:24px 26px !important;
    box-shadow:0 4px 24px rgba(0,0,0,.06);
    text-decoration:none !important;
    color:inherit;
    box-sizing:border-box;
    transition:transform .15s, box-shadow .15s;
    cursor:pointer;
  }
  .gb-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.1)}

  .gb-main{grid-area:main !important;min-width:0}
  .gb-tour{font-size:19px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
  .gb-date{font-size:13px;color:#727056;margin-bottom:14px}
  .gb-client{display:flex !important;flex-direction:column !important;gap:5px !important;font-size:13px;color:#444}
  .gb-client-row{display:flex !important;align-items:center !important;gap:7px}
  .gb-client b{color:#1a1a1a}
  .gb-client a{color:#4e75a6;text-decoration:none}
  .gb-client a:hover{text-decoration:underline}

  .gb-side{
    grid-area:side;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:12px;
    white-space:nowrap;
  }
  .gb-status{font-size:12px;font-weight:700;padding:6px 16px;border-radius:100px}
  .gb-status--cancelled{background:#eee;color:#888}
  .gb-status--pending{background:#fff3e0;color:#e65100}
  .gb-status--paid{background:#eff7df;color:#3c7a1e}
  .gb-open-btn{background:#1a1a1a;color:#fff;padding:11px 26px;border-radius:100px;
    font-size:13px;font-weight:600;text-align:center}

  .gb-empty{background:#fff;border-radius:20px;padding:60px 20px;text-align:center;color:#727056;
    box-shadow:0 4px 24px rgba(0,0,0,.06);line-height:1.6}
  .gb-empty .ico{font-size:44px;margin-bottom:14px}

  .gb-guard{max-width:480px;margin:0 auto;padding:180px 24px;text-align:center;
    font-family:'Montserrat',sans-serif;display:none}
  .gb-guard .ico{font-size:46px;margin-bottom:14px}
  .gb-guard h2{font-size:22px;font-weight:700;margin-bottom:10px;color:#1a1a1a}
  .gb-guard p{font-size:14px;color:#727056;margin-bottom:24px}
  .gb-guard a{background:#1a1a1a;color:#fff;padding:13px 36px;border-radius:100px;
    font-size:14px;font-weight:600;text-decoration:none;display:inline-block}

  @media(max-width:600px){
    .gb-card{grid-template-columns:1fr;grid-template-areas:"main""side"}
    .gb-side{align-items:flex-start}
  }

  .gb-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
  .gb-clear-btn{background:#fff;color:#e53935;border:1.5px solid #e53935;padding:10px 22px;
    border-radius:100px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;flex-shrink:0;margin-top:6px;transition:background .2s}
  .gb-clear-btn:hover{background:#fff0f0}

</style>
</head>
<body>

<header class="header visible">
  <div class="header-left">
    <img class="logo" src="image/logo.png" alt="Лого">
    <nav class="nav">
      <a href="main.html">главная</a>
      <div class="nav-item--tours">
        <a href="#">туры</a>
        <div class="nav-dropdown">
          <a href="tours/tours.html#odnodnevnye">однодневные</a>
          <a href="tours/tours.html#mnogodnevnye">многодневные</a>
          <a href="tours/tours.html#gornye">горные</a>
        </div>
      </div>
      <a href="#">контакты</a>
      <a href="gidy.html">гидам</a>
    </nav>
  </div>
  <div class="header-btns">
    <a href="#" class="header-btn-reg" id="regOpenBtn">регистрация</a>
    <a href="#" class="header-btn-login" id="authOpenBtn">вход</a>
  </div>
</header>

<div class="gb-guard" id="gbGuard">
  <div class="ico">🔒</div>
  <h2>Доступ только для гидов</h2>
  <p>Эта страница доступна гидам ДагТур.</p>
  <a href="main.html">На главную</a>
</div>

<div class="gb-page" id="gbPage" style="display:none">
  <div class="gb-head-row">
    <div>
      <h1 class="gb-title">Заказы клиентов</h1>
      <p class="gb-sub">Здесь заказы, в которых вас выбрали гидом. Откройте заказ, чтобы связаться с клиентом.</p>
    </div>
    <button class="gb-clear-btn" id="gbClearBtn" style="display:none">Очистить отменённые</button>
  </div>
  <div class="gb-list" id="gbList"></div>
</div>

<!-- AUTH МОДАЛКА -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-modal">
    <button class="auth-close" id="authClose">✕</button>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Войти</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>
    <div id="loginForm">
      <div class="auth-field"><label>Email</label><input type="email" id="loginEmail" placeholder="example@mail.ru"></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
      <button class="auth-submit" id="loginBtn">Войти</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="auth-field"><label>Имя</label><input type="text" id="registerName" placeholder="Иван"></div>
      <div class="auth-field"><label>Email</label><input type="email" id="registerEmail" placeholder="example@mail.ru"></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="registerPassword" placeholder="••••••••"></div>
      <button class="auth-submit" id="registerBtn">Зарегистрироваться</button>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(s){
  const d=new Date(s+'T00:00:00');
  const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const w=['вс','пн','вт','ср','чт','пт','сб'];
  return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear()+', '+w[d.getDay()];
}
async function call(url,options={}){
  const res=await fetch(url,{credentials:'same-origin',...options});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Ошибка сервера');
  return data;
}

function render(bookings){
  const list=document.getElementById('gbList');
  if(!bookings.length){
    list.innerHTML=`<div class="gb-empty"><div class="ico">🧭</div>
      Пока нет заказов. Как только кто-то забронирует тур и вас выберут гидом — заказ появится здесь.</div>`;
    return;
  }
    const hasCancelled = bookings.some(b => b.status === 'cancelled');
    const clearBtn = document.getElementById('gbClearBtn');
    if (clearBtn) clearBtn.style.display = hasCancelled ? '' : 'none';
  list.innerHTML=bookings.map(b=>{
    
    const cancelled=b.status==='cancelled';
    const statusText = b.status==='cancelled' ? 'Отменён'
      : b.status==='pending' ? 'Ожидаем предоплату' : 'Активен';
    const phone=b.customer_phone
      ? `<div class="gb-client-row">📞 <a href="tel:${esc(b.customer_phone)}" onclick="event.stopPropagation()">${esc(b.customer_phone)}</a></div>`
      : '';
    const email=b.customer_email
      ? `<div class="gb-client-row">✉️ <a href="mailto:${esc(b.customer_email)}" onclick="event.stopPropagation()">${esc(b.customer_email)}</a></div>`
      : '';
    return `
      <div class="gb-card" onclick="location.href='guide-order.html?id=${b.id}'">
        <div class="gb-main">
          <div class="gb-tour">${esc(b.tour_title||'Тур')}</div>
          <div class="gb-date">📅 ${fmtDate(b.date)} · ${b.people} чел. · заказ №${String(b.id).padStart(6,'0')}</div>
          <div class="gb-client">
            <div class="gb-client-row">Клиент: <b>${esc(b.customer_name||b.client_name||'—')}</b></div>
            ${phone}${email}
          </div>
        </div>
        <div class="gb-side">
          <span class="gb-status gb-status--${b.status}">${statusText}</span>
          <span class="gb-open-btn">Открыть тур →</span>
        </div>
      </div>`;
  }).join('');
}

(async()=>{
  try{
    const {user}=await call('/api/me');
    if(!user||user.role!=='guide'){
      document.getElementById('gbGuard').style.display='block';
      return;
    }
    document.getElementById('gbPage').style.display='block';
    const {bookings}=await call('/api/guide/bookings');
    render(bookings);
  }catch{
    document.getElementById('gbGuard').style.display='block';
  }
})();
document.getElementById('gbClearBtn').addEventListener('click', async () => {
  if (!confirm('Скрыть все отменённые заказы из списка? Данные сохранятся в системе.')) return;
  try {
    await call('/api/guide/bookings/clear-cancelled', { method: 'POST' });
    const { bookings } = await call('/api/guide/bookings');
    render(bookings);
  } catch (e) { alert(e.message); }
});
</script>
</body>
</html>
