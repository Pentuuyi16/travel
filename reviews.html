<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы — ДагТур</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/footer.css">
<style>
  body{background:#f5f5f2;margin:0}
  .header.visible{background:#e6effe}
  .header.visible .nav a{color:#1a1a1a}

  .rv-page{max-width:1100px;margin:0 auto;padding:130px 24px 90px;font-family:'Montserrat',sans-serif}
  .rv-top{text-align:center;margin-bottom:44px}
  .rv-title{font-size:38px;font-weight:700;letter-spacing:-1px;color:#1a1a1a;margin:0 0 10px}
  .rv-sub{font-size:15px;color:#727056}
  .rv-write{display:inline-block;margin-top:18px;background:#4e75a6;color:#fff;text-decoration:none;
    padding:12px 30px;border-radius:100px;font-size:14px;font-weight:600}
  .rv-write:hover{background:#3a5d8a}

  .rv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .rv-card{background:#fff;border-radius:20px;padding:26px 24px;box-shadow:0 4px 24px rgba(0,0,0,.06);
    display:flex;flex-direction:column}
  .rv-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .rv-card-author{display:flex;align-items:center;gap:12px}
  .rv-card-av{width:44px;height:44px;border-radius:50%;background:#4e75a6;color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:17px}
  .rv-card-name{font-size:16px;font-weight:700;color:#1a1a1a}
  .rv-card-date{font-size:12px;color:#aaa;margin-top:2px}
  .rv-card-stars{color:#FFD600;font-size:15px;letter-spacing:2px}
  .rv-card-stars span{color:#ddd}
  .rv-card-text{font-size:14px;line-height:1.65;color:#333;margin-top:6px}

  .rv-pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:44px}
  .rv-pager button{min-width:42px;height:42px;border-radius:12px;border:1.5px solid rgba(0,0,0,.12);
    background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:#1a1a1a;cursor:pointer;
    transition:.15s;padding:0 12px}
  .rv-pager button:hover:not(:disabled){border-color:#4e75a6;color:#4e75a6}
  .rv-pager button.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  .rv-pager button:disabled{opacity:.4;cursor:default}

  .rv-empty{text-align:center;color:#727056;font-size:16px;padding:80px 20px;
    background:#fff;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,.06)}

  @media(max-width:900px){.rv-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.rv-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="header visible">
  <div class="header-left">
    <img class="logo" src="image/logo.png" alt="Лого">
    <nav class="nav">
      <a href="main.html">главная</a>
      <div class="nav-item--tours">
        <a href="#">туры</a>
        <div class="nav-dropdown">
          <a href="tours/tours.html#odnodnevnye">однодневные</a>
          <a href="tours/tours.html#mnogodnevnye">многодневные</a>
          <a href="tours/tours.html#gornye">горные</a>
        </div>
      </div>
      <a href="#">контакты</a>
      <a href="gidy.html">гидам</a>
    </nav>
  </div>
  <div class="header-btns">
    <a href="#" class="header-btn-reg" id="regOpenBtn">регистрация</a>
    <a href="#" class="header-btn-login" id="authOpenBtn">вход</a>
  </div>
</header>

<div class="rv-page">
  <div class="rv-top">
    <h1 class="rv-title">Отзывы путешественников</h1>
    <p class="rv-sub">Что говорят те, кто уже побывал с нами в горах Дагестана</p>
    <br>
    <a href="review.html" class="rv-write">Написать отзыв</a>
  </div>
  <div class="rv-grid" id="rvGrid"></div>
  <div class="rv-pager" id="rvPager"></div>
</div>

<script type="module" src="js/auth.js"></script>
<script>
let curPage = 1;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stars(r){r=Math.max(1,Math.min(5,r||5));return '★'.repeat(r)+'<span>'+'★'.repeat(5-r)+'</span>';}
function fmtDate(s){
  const d=new Date((s||'').replace(' ','T')+'Z');
  if(isNaN(d))return '';
  return d.toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});
}

async function load(page){
  try{
    const res=await fetch('/api/reviews?page='+page,{credentials:'same-origin'});
    const data=await res.json();
    const reviews=data.reviews||[];
    const grid=document.getElementById('rvGrid');

    if(!reviews.length){
      grid.innerHTML='';
      document.querySelector('.rv-page').insertAdjacentHTML('beforeend','');
      grid.innerHTML=`<div class="rv-empty" style="grid-column:1/-1">Пока нет отзывов. Станьте первым!</div>`;
      document.getElementById('rvPager').innerHTML='';
      return;
    }

    grid.innerHTML=reviews.map(r=>`
      <div class="rv-card">
        <div class="rv-card-head">
          <div class="rv-card-author">
            <div class="rv-card-av">${esc((r.author||'?')[0].toUpperCase())}</div>
            <div>
              <div class="rv-card-name">${esc(r.author)}</div>
              <div class="rv-card-date">${fmtDate(r.created_at)}</div>
            </div>
          </div>
        </div>
        <div class="rv-card-stars">${stars(r.rating)}</div>
        <div class="rv-card-text">${esc(r.text)}</div>
      </div>`).join('');

    renderPager(data.page, data.totalPages);
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    document.getElementById('rvGrid').innerHTML=`<div class="rv-empty" style="grid-column:1/-1">Не удалось загрузить отзывы</div>`;
  }
}

function renderPager(page, totalPages){
  const pager=document.getElementById('rvPager');
  if(totalPages<=1){ pager.innerHTML=''; return; }
  let html=`<button ${page<=1?'disabled':''} onclick="go(${page-1})">←</button>`;
  for(let i=1;i<=totalPages;i++){
    html+=`<button class="${i===page?'active':''}" onclick="go(${i})">${i}</button>`;
  }
  html+=`<button ${page>=totalPages?'disabled':''} onclick="go(${page+1})">→</button>`;
  pager.innerHTML=html;
}

function go(page){ curPage=page; load(page); }
window.go=go;

load(1);
</script>
</body>
</html>
