<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои заказы — ДагТур</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/footer.css">
<style>
  body{background:#f5f5f2}
  .header.visible{background:#e6effe}
  .header.visible .nav a{color:#1a1a1a}

  .ord-page{max-width:860px;margin:0 auto;padding:130px 24px 90px;font-family:'Montserrat',sans-serif}
  .ord-title{font-size:34px;font-weight:700;letter-spacing:-.5px;color:#1a1a1a;margin-bottom:6px}
  .ord-sub{font-size:14px;color:#727056;margin-bottom:30px}

  .ord-list{display:flex;flex-direction:column;gap:16px}
  .ord-card{background:#fff;border-radius:20px;padding:24px 26px;box-shadow:0 4px 24px rgba(0,0,0,.06);
    display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .ord-main{flex:1;min-width:220px}
  .ord-tour{font-size:19px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
  .ord-date{font-size:13px;color:#727056;margin-bottom:14px}
  .ord-row{display:flex;gap:10px;align-items:center;font-size:13px;color:#555;margin-bottom:6px}
  .ord-guide-av{width:30px;height:30px;border-radius:50%;background:#4e75a6;color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:700;overflow:hidden;flex-shrink:0}
  .ord-guide-av img{width:100%;height:100%;object-fit:cover}
  .ord-status{font-size:12px;font-weight:700;padding:5px 14px;border-radius:100px;white-space:nowrap}
  .ord-status--pending{background:#fff3e0;color:#e65100}
  .ord-status--paid{background:#eff7df;color:#3c7a1e}
  .ord-status--cancelled{background:#eee;color:#888}
  .ord-actions{display:flex;flex-direction:column;gap:8px;min-width:150px}
  .ord-btn-pay{background:#1a1a1a;color:#fff;border:none;padding:11px 20px;border-radius:100px;
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
  .ord-btn-pay:hover{background:#333}
  .ord-btn-cancel{background:#fff;color:#e53935;border:1.5px solid #e53935;padding:11px 20px;
    border-radius:100px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .ord-btn-cancel:hover{background:#fff0f0}

  .ord-empty{background:#fff;border-radius:20px;padding:60px 20px;text-align:center;color:#727056;
    box-shadow:0 4px 24px rgba(0,0,0,.06)}
  .ord-empty .ico{font-size:44px;margin-bottom:14px}
  .ord-empty a{color:#4e75a6;font-weight:600;text-decoration:none}

  .ord-guard{max-width:480px;margin:0 auto;padding:180px 24px;text-align:center;
    font-family:'Montserrat',sans-serif;display:none}
  .ord-guard .ico{font-size:46px;margin-bottom:14px}
  .ord-guard h2{font-size:22px;font-weight:700;margin-bottom:10px;color:#1a1a1a}
  .ord-guard p{font-size:14px;color:#727056;margin-bottom:24px}
  .ord-guard button{background:#1a1a1a;color:#fff;border:none;padding:13px 36px;border-radius:100px;
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<header class="header visible">
  <div class="header-left">
    <img class="logo" src="image/logo.png" alt="Лого">
    <nav class="nav">
      <a href="main.html">главная</a>
      <div class="nav-item--tours">
        <a href="#">туры</a>
        <div class="nav-dropdown">
          <a href="tours/tours.html#odnodnevnye">однодневные</a>
          <a href="tours/tours.html#mnogodnevnye">многодневные</a>
          <a href="tours/tours.html#gornye">горные</a>
        </div>
      </div>
      <a href="#">контакты</a>
      <a href="gidy.html">гидам</a>
    </nav>
  </div>
  <div class="header-btns">
    <a href="#" class="header-btn-reg" id="regOpenBtn">регистрация</a>
    <a href="#" class="header-btn-login" id="authOpenBtn">вход</a>
  </div>
</header>

<div class="ord-guard" id="ordGuard">
  <div class="ico">🔒</div>
  <h2>Нужен вход в аккаунт</h2>
  <p>Войдите, чтобы увидеть свои заказы.</p>
  <button onclick="window.openAuth && window.openAuth('login')">Войти</button>
</div>

<div class="ord-page" id="ordPage" style="display:none">
  <h1 class="ord-title">Мои заказы</h1>
  <p class="ord-sub">Здесь все ваши бронирования туров.</p>
  <div class="ord-list" id="ordList"></div>
</div>

<!-- AUTH МОДАЛКА -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-modal">
    <button class="auth-close" id="authClose">✕</button>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Войти</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>
    <div id="loginForm">
      <div class="auth-field"><label>Email</label><input type="email" id="loginEmail" placeholder="example@mail.ru"></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
      <button class="auth-submit" id="loginBtn">Войти</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="auth-field"><label>Имя</label><input type="text" id="registerName" placeholder="Иван"></div>
      <div class="auth-field"><label>Email</label><input type="email" id="registerEmail" placeholder="example@mail.ru"></div>
      <div class="auth-field"><label>Пароль</label><input type="password" id="registerPassword" placeholder="••••••••"></div>
      <button class="auth-submit" id="registerBtn">Зарегистрироваться</button>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(s){
  const d=new Date(s+'T00:00:00');
  const m=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const w=['вс','пн','вт','ср','чт','пт','сб'];
  return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear()+', '+w[d.getDay()];
}

async function call(url,options={}){
  const res=await fetch(url,{credentials:'same-origin',...options});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Ошибка сервера');
  return data;
}

function render(bookings){
  const list=document.getElementById('ordList');
  if(!bookings.length){
    list.innerHTML=`<div class="ord-empty"><div class="ico">🧳</div>
      У вас пока нет заказов.<br><a href="tours/tours.html">Выбрать тур →</a></div>`;
    return;
  }
  list.innerHTML=bookings.map(b=>{
    const av=b.guide_avatar
      ? `<img src="${esc(b.guide_avatar)}" alt="">`
      : esc((b.guide_name||'?')[0].toUpperCase());
    const cancelled=b.status==='cancelled';
    return `
      <div class="ord-card">
        <div class="ord-main">
          <div class="ord-tour">${esc(b.tour_title||'Тур')}</div>
          <div class="ord-date">📅 ${fmtDate(b.date)} · ${b.people} чел. · заказ №${String(b.id).padStart(6,'0')}</div>
          <div class="ord-row"><div class="ord-guide-av">${av}</div> Гид: ${esc(b.guide_name)}</div>
        </div>
        <span class="ord-status ord-status--${b.status}">
          ${cancelled?'Отменён':b.status==='pending'?'Ожидаем предоплату':'Активен'}
        </span>
        <div class="ord-actions">
          ${cancelled?'':`
            <a class="ord-btn-pay" href="booking-confirm.html?id=${b.id}">Перейти к оплате</a>
            <button class="ord-btn-cancel" onclick="cancelOrder(${b.id})">Отменить бронь</button>
          `}
        </div>
      </div>`;
  }).join('');
}

async function load(){
  try{
    const {bookings}=await call('/api/booking/my');
    render(bookings);
  }catch(e){alert(e.message);}
}

async function cancelOrder(id){
  if(!confirm('Отменить бронирование? Дата освободится.'))return;
  try{
    await call('/api/booking/'+id+'/cancel',{method:'POST'});
    load();
  }catch(e){alert(e.message);}
}
window.cancelOrder=cancelOrder;

(async()=>{
  try{
    const {user}=await call('/api/me');
    if(user){
      document.getElementById('ordPage').style.display='block';
      load();
    }else{
      document.getElementById('ordGuard').style.display='block';
    }
  }catch{
    document.getElementById('ordGuard').style.display='block';
  }
})();
</script>
</body>
</html>
